Name: pay.rpc
ListenOn: 0.0.0.0:9003
Etcd:
  Hosts:
  - etcd:2379
  Key: pay.rpc

Mysql:
  DataSource: mall_user:1234@tcp(mysql:3306)/mall?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

CacheRedis:
- Host: redis:6379
  Type: node
  Pass:

UserRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: user.rpc

OrderRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: order.rpc

Auth: true
StrictControl: true
Redis:
  Key: rpc:auth:pay
  Host: redis:6379
  Type: node
  Pass:

Prometheus:
  Host: 0.0.0.0
  Port: 10093
  Path: /metrics

Telemetry:
  Name: pay.rpc        # 改成对应服务名
  Endpoint: jaeger:4318
  Sampler: 1.0
  Batcher: otlphttp
