Name: order.rpc
ListenOn: 0.0.0.0:9002
Etcd:
  Hosts:
  - etcd:2379
  Key: order.rpc

Mysql:
  DataSource: mall_user:1234@tcp(mysql:3306)/mall?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

CacheRedis:
- Host: redis:6379
  Type: node
  Pass:

UserRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: user.rpc

ProductRpc:
  Etcd:
    Hosts:
    - etcd:2379
    Key: product.rpc
  
Auth: true
StrictControl: true
Redis:
  Key: rpc:auth:order
  Host: redis:6379
  Type: node
  Pass:

Prometheus:
  Host: 0.0.0.0
  Port: 10092
  Path: /metrics

Telemetry:
  Name: order.rpc       # 改成对应服务名
  Endpoint: jaeger:4318
  Sampler: 1.0
  Batcher: otlphttp
