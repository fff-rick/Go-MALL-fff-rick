Name: product.rpc
ListenOn: 0.0.0.0:9001
Etcd:
  Hosts:
  - etcd:2379
  Key: product.rpc

Mysql:
  DataSource: mall_user:1234@tcp(mysql:3306)/mall?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

CacheRedis:
  - Host: redis:6379
    Type: node
    Pass:

Auth: true
StrictControl: true
Redis:
  Key: rpc:auth:product
  Host: redis:6379
  Type: node
  Pass:

Prometheus:
  Host: 0.0.0.0
  Port: 10091
  Path: /metrics

Telemetry:
  Name: product.rpc       # 改成对应服务名
  Endpoint: jaeger:4318
  Sampler: 1.0
  Batcher: otlphttp
